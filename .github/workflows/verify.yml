name: Verify

on:
  push:
    branches: [main, feature/venture-planner]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Install patch-current Dalamud build references
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'dalamud'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          if (-not (Test-Path -LiteralPath (Join-Path $destination 'Dalamud.dll'))) {
            throw 'The official Dalamud distribution did not contain Dalamud.dll.'
          }
          "DALAMUD_HOME=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify plugin
        shell: pwsh
        run: ./scripts/verify.ps1
